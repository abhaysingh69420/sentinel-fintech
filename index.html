<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel | Privacy-First Fintech AI</title>
    <style>
        /* Modern Dark Theme */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0e1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        /* Typography */
        h1 { font-size: 4rem; margin: 0; background: linear-gradient(90deg, #00ff41, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: -2px; }
        h2 { font-size: 1.5rem; color: #a1a1aa; font-weight: 400; margin-top: 10px; max-width: 600px; }
        
        /* Badges */
        .badge { background: rgba(0, 255, 65, 0.1); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; color: #00ff41; border: 1px solid #00ff41; margin-bottom: 25px; display: inline-block; font-weight: 600; letter-spacing: 1px; }
        
        /* Buttons */
        .btn-container { margin-top: 40px; display: flex; gap: 20px; }
        .btn { padding: 15px 35px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: 0.3s; font-size: 1rem; }
        
        .btn-primary { background: #00ff41; color: #0e1117; border: 1px solid #00ff41; }
        .btn-primary:hover { background: #00cc33; transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 255, 65, 0.4); }
        
        .btn-secondary { background: transparent; color: white; border: 1px solid #3d3d3d; }
        .btn-secondary:hover { border-color: white; transform: translateY(-2px); }

        /* Footer */
        .footer { position: absolute; bottom: 30px; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>
    
    <div class="badge">RESEARCH PROTOTYPE v1.0</div>
    
    <h1>Sentinel</h1>
    <h2>The Hybrid AI Architecture for Banking.</h2>
    
    <p style="color: #888; margin-top: 20px; line-height: 1.6;">
        Sentinel solves the "Privacy vs. Intelligence" deadlock.<br>
        <strong>Balance checks stay local. Market insights go global.</strong>
    </p>

    <div class="btn-container">
        <a href="https://github.com/abhaysingh69420/sentinel-fintech" class="btn btn-primary">
            View Source Code
        </a>
        <a href="https://github.com/abhaysingh69420/sentinel-fintech/blob/main/README.md" class="btn btn-secondary">
            Read Documentation
        </a>
    </div>

    <div class="footer">
        Developed by Abhay Pratap Singh • 2026
    </div>

</body>
</html>
